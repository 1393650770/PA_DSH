# pa-mcp-dsh-plugin — PA_MCP 兼容性冒烟
#
# 目标：PA_MCP 每次改动(尤其增/删/改工具)后，自动验证它仍能被本插件桥接——
#   spawn python -m pa_mcp.server → tools/list(>=100) → callTool(list_strategies)。
# 任何一环坏了(工具变少/改名/schema 破坏/server 起不来)，本工作流红，提醒你同步检查插件。
#
# 触发方式（二选一，见 README「CI 冒烟」）：
#   A) 本仓库自身 push / PR —— 跑一次（用 PA_MCP_REPO 指定的 PA_MCP 分支/提交）。
#   B) PA_MCP 仓库推送时用 repository_dispatch 通知本仓库（需在 PA_MCP 侧配一条 workflow）。
name: pa-mcp smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  repository_dispatch:
    types: [pa-mcp-changed]

env:
  # PA_MCP 仓库地址：本地/私有仓填你的 remote；走 GitHub 可留空用同机构同名仓。
  PA_MCP_REPO: ${{ vars.PA_MCP_REPO || github.repository_owner + '/PA_MCP' }}
  PA_MCP_BRANCH: ${{ vars.PA_MCP_BRANCH || 'main' }}
  PA_MCP_ROOT_DIR: pa_mcp_checkout

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: 检出插件仓库
        uses: actions/checkout@v4

      - name: 检出 PA_MCP 到子目录
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PA_MCP_REPO }}
          ref: ${{ env.PA_MCP_BRANCH }}
          path: ${{ env.PA_MCP_ROOT_DIR }}

      - name: 装 python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装 PA_MCP 依赖(含 mcp sdk)
        working-directory: ${{ env.PA_MCP_ROOT_DIR }}
        run: |
          pip install .
          # 若不想装 akshare 联网大户，可注释上一行改用 --no-deps + 手装核心：
          # pip install --no-deps -e . && pip install mcp duckdb pandas pyyaml pydantic pydantic-settings tenacity croniter structlog httpx
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'

      - name: 装 node + 插件依赖
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci || npm install

      - name: 类型检查 + 编译
        run: |
          npm run typecheck
          npm run build

      - name: 跑 PA_MCP 桥接冒烟
        run: node scripts/smoke.mjs "${{ env.PA_MCP_ROOT_DIR }}" "python3"
